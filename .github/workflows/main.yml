name: IT Helpdesk CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          test -f index.html
          test -f ticket.html
          test -f services.html
          test -f knowledge.html
          test -f contact.html
          test -f css/style.css
          test -f js/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
